<svg xmlns="http://www.w3.org/2000/svg" width="1102" height="1003" viewBox="0 0 1102 1003" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a6ea5"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #3a6ea5; stroke-width: 1.5; }
    .head { stroke: #3a6ea5; stroke-width: 1.5; }
    .title { font-size: 15px; font-weight: bold; fill: #1a1a1a; }
    .title.ext { font-weight: normal; font-style: italic; fill: #444444; }
    .field { font-size: 12px; fill: #333333; }
    .edge { stroke: #3a6ea5; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .lbl { font-size: 11px; fill: #555555; }
  </style>
  <rect x="0" y="0" width="1102" height="1003" fill="#ffffff"/>
  <!-- sampling_log -->
  <g>
    <rect class="head" x="30" y="30" width="200" height="30" style="fill:#dbe7f5"/>
    <rect class="box" x="30" y="60" width="200" height="46"/>
    <text class="title" x="42" y="50">sampling_log</text>
    <text class="field" x="42" y="83">id (PK)</text>
    <text class="field" x="42" y="100">campaign_id (FK)</text>
  </g>
  <!-- observation_log -->
  <g>
    <rect class="head" x="30" y="200" width="200" height="30" style="fill:#dbe7f5"/>
    <rect class="box" x="30" y="230" width="200" height="80"/>
    <text class="title" x="42" y="220">observation_log</text>
    <text class="field" x="42" y="253">id (PK)</text>
    <text class="field" x="42" y="270">sampling_log_id (FK)</text>
    <text class="field" x="42" y="287">provision_id (FK)</text>
    <text class="field" x="42" y="304">= ai4sh-metabarcoding</text>
  </g>
  <!-- observation -->
  <g>
    <rect class="head" x="30" y="440" width="200" height="30" style="fill:#dbe7f5"/>
    <rect class="box" x="30" y="470" width="200" height="63"/>
    <text class="title" x="42" y="460">observation</text>
    <text class="field" x="42" y="493">id (PK)</text>
    <text class="field" x="42" y="510">observation_log_id (FK)</text>
    <text class="field" x="42" y="527">sample_id (FK)</text>
  </g>
  <!-- observation_measurement -->
  <g>
    <rect class="head" x="30" y="640" width="214" height="30" style="fill:#dbe7f5"/>
    <rect class="box" x="30" y="670" width="214" height="63"/>
    <text class="title" x="42" y="660">observation_measurement</text>
    <text class="field" x="42" y="693">observation_id (FK)</text>
    <text class="field" x="42" y="710">indicator_id (FK)</text>
    <text class="field" x="42" y="727">value</text>
  </g>
  <!-- indicator -->
  <g>
    <rect class="head" x="30" y="800" width="202" height="30" style="fill:#dcefdc"/>
    <rect class="box" x="30" y="830" width="202" height="63"/>
    <text class="title" x="42" y="820">indicator</text>
    <text class="field" x="42" y="853">id (PK)</text>
    <text class="field" x="42" y="870">name, alias</text>
    <text class="field" x="42" y="887">19 eDNA summary indicators</text>
  </g>
  <!-- method_pipeline_step -->
  <g>
    <rect class="head" x="310" y="30" width="202" height="30" style="fill:#dcefdc"/>
    <rect class="box" x="310" y="60" width="202" height="148"/>
    <text class="title" x="322" y="50">method_pipeline_step</text>
    <text class="field" x="322" y="83">id (PK)</text>
    <text class="field" x="322" y="100">method_pipeline_id (FK)</text>
    <text class="field" x="322" y="117">step, stage, name</text>
    <text class="field" x="322" y="134">lab_protocol_id (FK)</text>
    <text class="field" x="322" y="151">edna_primer_pair_id (FK)</text>
    <text class="field" x="322" y="168">software_id (FK)</text>
    <text class="field" x="322" y="185">taxonomy_reference_id (FK)</text>
    <text class="field" x="322" y="202">parameters (JSONB)</text>
  </g>
  <!-- edna_run_step -->
  <g>
    <rect class="head" x="310" y="280" width="216" height="30" style="fill:#dbe7f5"/>
    <rect class="box" x="310" y="310" width="216" height="63"/>
    <text class="title" x="322" y="300">edna_run_step</text>
    <text class="field" x="322" y="333">observation_id (FK)</text>
    <text class="field" x="322" y="350">method_pipeline_step_id (FK)</text>
    <text class="field" x="322" y="367">reads_in, reads_out</text>
  </g>
  <!-- edna_asv_abundance -->
  <g>
    <rect class="head" x="310" y="460" width="200" height="30" style="fill:#dbe7f5"/>
    <rect class="box" x="310" y="490" width="200" height="63"/>
    <text class="title" x="322" y="480">edna_asv_abundance</text>
    <text class="field" x="322" y="513">observation_id (FK)</text>
    <text class="field" x="322" y="530">edna_asv_id (FK)</text>
    <text class="field" x="322" y="547">rel_abundance, read_count</text>
  </g>
  <!-- method_pipeline -->
  <g>
    <rect class="head" x="590" y="30" width="216" height="30" style="fill:#dcefdc"/>
    <rect class="box" x="590" y="60" width="216" height="63"/>
    <text class="title" x="602" y="50">method_pipeline</text>
    <text class="field" x="602" y="83">id (PK)</text>
    <text class="field" x="602" y="100">name (ai4sh-16s | ai4sh-its)</text>
    <text class="field" x="602" y="117">analysis_method_id (FK)</text>
  </g>
  <!-- edna_asv -->
  <g>
    <rect class="head" x="590" y="460" width="200" height="30" style="fill:#dbe7f5"/>
    <rect class="box" x="590" y="490" width="200" height="97"/>
    <text class="title" x="602" y="480">edna_asv</text>
    <text class="field" x="602" y="513">id (PK)</text>
    <text class="field" x="602" y="530">method_pipeline_id (FK)</text>
    <text class="field" x="602" y="547">asv_key</text>
    <text class="field" x="602" y="564">taxon_id (FK)</text>
    <text class="field" x="602" y="581">lineage</text>
  </g>
  <!-- taxonomy_reference -->
  <g>
    <rect class="head" x="590" y="680" width="200" height="30" style="fill:#fbe3c8"/>
    <rect class="box" x="590" y="710" width="200" height="46"/>
    <text class="title" x="602" y="700">taxonomy_reference</text>
    <text class="field" x="602" y="733">id (PK)</text>
    <text class="field" x="602" y="750">alias (silva / unite ...)</text>
  </g>
  <!-- analysis_method -->
  <g>
    <rect class="head" x="870" y="30" width="200" height="30" style="fill:#dcefdc"/>
    <rect class="box" x="870" y="60" width="200" height="46"/>
    <text class="title" x="882" y="50">analysis_method</text>
    <text class="field" x="882" y="83">id (PK)</text>
    <text class="field" x="882" y="100">name</text>
  </g>
  <!-- provision_indicator -->
  <g>
    <rect class="head" x="870" y="200" width="200" height="30" style="fill:#dcefdc"/>
    <rect class="box" x="870" y="230" width="200" height="80"/>
    <text class="title" x="882" y="220">provision_indicator</text>
    <text class="field" x="882" y="253">provision_id (FK)</text>
    <text class="field" x="882" y="270">indicator_id (FK)</text>
    <text class="field" x="882" y="287">analysis_method_id (FK)</text>
    <text class="field" x="882" y="304">unit_id (FK)</text>
  </g>
  <!-- taxon -->
  <g>
    <rect class="head" x="870" y="460" width="202" height="30" style="fill:#fbe3c8"/>
    <rect class="box" x="870" y="490" width="202" height="97"/>
    <text class="title" x="882" y="480">taxon</text>
    <text class="field" x="882" y="513">id (PK)</text>
    <text class="field" x="882" y="530">parent_taxon_id (FK)</text>
    <text class="field" x="882" y="547">taxon_rank_id (FK)</text>
    <text class="field" x="882" y="564">taxonomy_reference_id (FK)</text>
    <text class="field" x="882" y="581">name, scientific_name</text>
  </g>
  <!-- taxon_rank -->
  <g>
    <rect class="head" x="870" y="700" width="200" height="30" style="fill:#fbe3c8"/>
    <rect class="box" x="870" y="730" width="200" height="46"/>
    <text class="title" x="882" y="720">taxon_rank</text>
    <text class="field" x="882" y="753">id (PK)</text>
    <text class="field" x="882" y="770">name, prefix</text>
  </g>
  <path class="edge" d="M130,106 C130,158 130,148 130,200"/>
  <path class="edge" d="M130,310 C130,378 130,372 130,440"/>
  <path class="edge" d="M130,533 C130,591 137,582 137,640"/>
  <path class="edge" d="M131,800 C131,760 137,773 137,733"/>
  <path class="edge" d="M230,496 C276,496 264,488 310,488"/>
  <path class="edge" d="M230,468 C304,468 236,326 310,326"/>
  <path class="edge" d="M590,498 C544,498 556,506 510,506"/>
  <path class="edge" d="M870,498 C824,498 836,536 790,536"/>
  <path class="edge" d="M698,123 C698,285 690,298 690,460"/>
  <path class="edge" d="M590,67 C545,67 557,51 512,51"/>
  <path class="edge" d="M411,208 C411,250 418,238 418,280"/>
  <path class="edge" d="M870,68 C831,68 845,86 806,86"/>
  <path class="edge" d="M970,106 C970,158 970,148 970,200"/>
  <path class="edge" d="M790,718 C868,718 792,568 870,568"/>
  <path class="edge" d="M970,700 C970,639 971,648 971,587"/>
  <rect x="30" y="923" width="18" height="12" style="fill:#dbe7f5" stroke="#3a6ea5"/>
  <text class="lbl" x="54" y="933">observation</text>
  <rect x="147" y="923" width="18" height="12" style="fill:#dcefdc" stroke="#3a6ea5"/>
  <text class="lbl" x="171" y="933">observation_utility</text>
  <rect x="320" y="923" width="18" height="12" style="fill:#fbe3c8" stroke="#3a6ea5"/>
  <text class="lbl" x="344" y="933">organism_utility</text>
  <text class="lbl" x="30" y="963">Results (observation) are kept apart from the method (observation_utility) and the taxonomy (organism_utility).</text>
  <text class="lbl" x="30" y="983">Every ASV points to its method pipeline, so the full methods section can be reproduced by a query.</text>
</svg>

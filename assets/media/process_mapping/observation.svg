<text class="cell" x="658" y="312" text-anchor="start">true</text>
<rect x="650" y="320" width="55" height="24" fill="#ffffff" stroke="#3a6ea5"/>
<text class="cell" x="658" y="336" text-anchor="start">true</text>
<circle cx="911" cy="211" r="11" fill="#3a6ea5"/>
<text class="badge" x="911" y="215" text-anchor="middle">1</text>
<text class="note" x="930" y="215" text-anchor="start">The process writes to two tables. The one</text>
<text class="note" x="930" y="233" text-anchor="start">with the shortest name (observation) is</text>
<text class="note" x="930" y="251" text-anchor="start">the main table and is written first.</text>
<rect x="30" y="384" width="760" height="96" rx="6" fill="#fff4c2" stroke="#3a6ea5"/>
<text class="gtitle" x="42" y="404" text-anchor="start">Main table: resolve foreign keys, then write observation</text>
<text class="cell" x="42" y="424" text-anchor="start">observation_log_id__observation_log_name  →  observation.observation_log.id  = 12 (example)</text>
<text class="cell" x="42" y="446" text-anchor="start">sample_id__sample_name  →  the sample of that name in the observation log's sampling log  →  id 845</text>
<text class="cell" x="42" y="468" text-anchor="start">provision_id  →  inherited from the observation log  →  ai4sh-agrolab</text>
<circle cx="911" cy="400" r="11" fill="#3a6ea5"/>
<text class="badge" x="911" y="404" text-anchor="middle">2</text>
<text class="note" x="930" y="404" text-anchor="start">Names are confirmed and replaced by ids.</text>
<text class="note" x="930" y="422" text-anchor="start">The observation row is inserted and the</text>
<text class="note" x="930" y="440" text-anchor="start">database returns its id (e.g. 5001).</text>
<path class="edge" d="M200,484 L200,530"/>

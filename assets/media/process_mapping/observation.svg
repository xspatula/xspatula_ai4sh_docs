<text class="cell" x="274" y="594" text-anchor="start">845</text>
<rect x="349" y="554" width="104" height="24" fill="#fbe3c8" stroke="#3a6ea5"/>
<text class="hd" x="357" y="570" text-anchor="start">provision_id</text>
<rect x="349" y="578" width="104" height="24" fill="#ffffff" stroke="#3a6ea5"/>
<text class="cell" x="357" y="594" text-anchor="start">7</text>
<rect x="453" y="554" width="97" height="24" fill="#fbe3c8" stroke="#3a6ea5"/>
<text class="hd" x="461" y="570" text-anchor="start">observed_at</text>
<rect x="453" y="578" width="97" height="24" fill="#ffffff" stroke="#3a6ea5"/>
<text class="cell" x="461" y="594" text-anchor="start">2025-02-01</text>
<rect x="30" y="642" width="760" height="96" rx="6" fill="#efe9f8" stroke="#3a6ea5"/>
<text class="gtitle" x="42" y="662" text-anchor="start">Child table: @indicator columns become rows</text>
<text class="cell" x="42" y="682" text-anchor="start">each @column header is an indicator name or alias: ph-h2o, ec, c-org</text>
<text class="cell" x="42" y="704" text-anchor="start">valid indicators are those the provision delivers (provision_indicator)  →  indicator ids</text>
<text class="cell" x="42" y="726" text-anchor="start">one row per @column: the new observation id + indicator_id + value; '&lt;0.5' is stored as 0.25</text>
<circle cx="911" cy="658" r="11" fill="#3a6ea5"/>
<text class="badge" x="911" y="662" text-anchor="middle">3</text>
<text class="note" x="930" y="662" text-anchor="start">The child table gets the main table id</text>
<text class="note" x="930" y="680" text-anchor="start">(observation_id = 5001), so the wide Excel</text>
<text class="note" x="930" y="698" text-anchor="start">row becomes several narrow rows.</text>
<text class="note" x="930" y="716" text-anchor="start">An unknown indicator stops the import.</text>

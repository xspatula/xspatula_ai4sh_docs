<text class="hd" x="260" y="828" text-anchor="start">value</text>
<rect x="252" y="836" width="55" height="24" fill="#ffffff" stroke="#3a6ea5"/>
<text class="cell" x="260" y="852" text-anchor="start">5.9</text>
<rect x="252" y="860" width="55" height="24" fill="#ffffff" stroke="#3a6ea5"/>
<text class="cell" x="260" y="876" text-anchor="start">32</text>
<rect x="252" y="884" width="55" height="24" fill="#ffffff" stroke="#3a6ea5"/>
<text class="cell" x="260" y="900" text-anchor="start">2.18</text>
<text class="lbl" x="30" y="938">manage_observation: one Excel row → one observation row plus one measurement row per @indicator column.</text>
<text class="lbl" x="30" y="958">All ids are examples.</text>

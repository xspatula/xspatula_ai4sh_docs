    <text class="field" x="732" y="280">process (FK)</text>
    <text class="field" x="732" y="297">parameter</text>
    <text class="field" x="732" y="314">in_schema, in_table</text>
    <text class="field" x="732" y="331">write</text>
    <text class="field" x="732" y="348">array_column ...</text>
  </g>
  <!-- process_parameter_permission -->
  <g>
    <rect class="head" x="720" y="400" width="255" height="30" style="fill:#dbe7f5"/>
    <rect class="box" x="720" y="430" width="255" height="97"/>
    <text class="title" x="732" y="420">process_parameter_permission</text>
    <text class="field" x="732" y="453">id (PK)</text>
    <text class="field" x="732" y="470">process (FK)</text>
    <text class="field" x="732" y="487">parameter</text>
    <text class="field" x="732" y="504">column_update</text>
    <text class="field" x="732" y="521">column_delete</text>
  </g>
  <!-- process_parameter_inherit -->
  <g>
    <rect class="head" x="720" y="570" width="250" height="30" style="fill:#dbe7f5"/>
    <rect class="box" x="720" y="600" width="250" height="114"/>
    <text class="title" x="732" y="590">process_parameter_inherit</text>
    <text class="field" x="732" y="623">id (PK)</text>
    <text class="field" x="732" y="640">process (FK)</text>
    <text class="field" x="732" y="657">parameter</text>
    <text class="field" x="732" y="674">src_schema, src_table, src_column</text>
    <text class="field" x="732" y="691">search_column, search_object</text>
    <text class="field" x="732" y="708">filter_column, filter_value</text>
  </g>
  <!-- process_parameter_auto_name -->
  <g>
    <rect class="head" x="390" y="555" width="247" height="30" style="fill:#dbe7f5"/>
    <rect class="box" x="390" y="585" width="247" height="80"/>
    <text class="title" x="402" y="575">process_parameter_auto_name</text>
    <text class="field" x="402" y="608">id (PK)</text>
    <text class="field" x="402" y="625">process (FK)</text>
    <text class="field" x="402" y="642">parameter</text>
    <text class="field" x="402" y="659">concat</text>
  </g>
  <path class="edge" d="M500,140 C500,200 500,190 500,250"/>
  <text class="lbl" x="506" y="191">root_process</text>
  <path class="edge" d="M720,118 C656,118 664,96 600,96"/>
  <text class="lbl" x="666" y="103">creator</text>
  <path class="edge" d="M720,144 C646,144 577,176 577,250"/>
  <text class="lbl" x="654" y="193">creator</text>
  <path class="edge" d="M390,300 C309,300 313,262 232,262"/>
  <path class="edge" d="M390,329 C328,329 339,445 277,445"/>
  <path class="edge" d="M390,358 C267,358 375,610 252,610"/>
  <path class="edge" d="M610,300 C670,300 660,282 720,282"/>
  <path class="edge" d="M610,329 C680,329 650,464 720,464"/>
  <path class="edge" d="M610,358 C748,358 582,642 720,642"/>
  <path class="edge" d="M500,394 C500,476 514,473 514,555"/>
  <text class="lbl" x="30" y="754">Every parameter table references process.process by its unique name (process), not by id.</text>
  <text class="lbl" x="30" y="774">root_process and process record their creator by community.user.user_name.</text>
</svg>

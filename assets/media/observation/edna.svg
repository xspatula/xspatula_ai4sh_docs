<svg xmlns="http://www.w3.org/2000/svg" width="1103" height="723" viewBox="0 0 1103 723" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a6ea5"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #3a6ea5; stroke-width: 1.5; }
    .head { stroke: #3a6ea5; stroke-width: 1.5; }
    .title { font-size: 15px; font-weight: bold; fill: #1a1a1a; }
    .title.ext { font-weight: normal; font-style: italic; fill: #444444; }
    .field { font-size: 12px; fill: #333333; }
    .edge { stroke: #3a6ea5; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .lbl { font-size: 11px; fill: #555555; }
  </style>
  <rect x="0" y="0" width="1103" height="723" fill="#ffffff"/>
  <!-- observation -->
  <g>
    <rect class="head" x="30" y="30" width="200" height="30" style="fill:#dbe7f5"/>
    <rect class="box" x="30" y="60" width="200" height="97"/>
    <text class="title" x="42" y="50">observation</text>
    <text class="field" x="42" y="83">id (PK)</text>
    <text class="field" x="42" y="100">observation_log_id (FK)</text>
    <text class="field" x="42" y="117">sample_id (FK)</text>
    <text class="field" x="42" y="134">provision_id (FK)</text>
    <text class="field" x="42" y="151">observed_at</text>
  </g>
  <!-- edna_asv_abundance -->
  <g>
    <rect class="head" x="360" y="30" width="230" height="30" style="fill:#dbe7f5"/>
    <rect class="box" x="360" y="60" width="230" height="97"/>
    <text class="title" x="372" y="50">edna_asv_abundance</text>
    <text class="field" x="372" y="83">observation_id (PK, FK)</text>
    <text class="field" x="372" y="100">edna_asv_id (PK, FK)</text>
    <text class="field" x="372" y="117">rel_abundance</text>
    <text class="field" x="372" y="134">read_count (rarefied)</text>
    <text class="field" x="372" y="151">raw_read_count</text>
  </g>
  <!-- edna_asv -->
  <g>
    <rect class="head" x="360" y="250" width="270" height="30" style="fill:#dbe7f5"/>
    <rect class="box" x="360" y="280" width="270" height="148"/>
    <text class="title" x="372" y="270">edna_asv</text>
    <text class="field" x="372" y="303">id (PK)</text>
    <text class="field" x="372" y="320">method_pipeline_id (FK)</text>
    <text class="field" x="372" y="337">asv_key</text>
    <text class="field" x="372" y="354">taxon_id (FK)</text>
    <text class="field" x="372" y="371">lineage</text>
    <text class="field" x="372" y="388">sequence</text>
    <text class="field" x="372" y="405">sequence_md5 (UK)</text>
    <text class="field" x="372" y="422">UNIQUE (method_pipeline_id, asv_key)</text>
  </g>
  <!-- edna_run_step -->
  <g>
    <rect class="head" x="30" y="300" width="243" height="30" style="fill:#dbe7f5"/>
    <rect class="box" x="30" y="330" width="243" height="80"/>
    <text class="title" x="42" y="320">edna_run_step</text>
    <text class="field" x="42" y="353">observation_id (PK, FK)</text>
    <text class="field" x="42" y="370">method_pipeline_step_id (PK, FK)</text>
    <text class="field" x="42" y="387">reads_in</text>
    <text class="field" x="42" y="404">reads_out</text>
  </g>
  <!-- organism_utility.taxon -->
  <g>
    <rect class="head" x="760" y="420" width="206" height="30" style="fill:#f4f4f4" stroke-dasharray="5,3"/>
    <rect class="box" x="760" y="450" width="206" height="46" stroke-dasharray="5,3"/>
    <text class="title ext" x="772" y="440">organism_utility.taxon</text>
    <text class="field" x="772" y="473">id (PK)</text>
    <text class="field" x="772" y="490">name, scientific_name</text>
  </g>
  <!-- observation_utility.method_pipeline -->
  <g>
    <rect class="head" x="760" y="250" width="313" height="30" style="fill:#f4f4f4" stroke-dasharray="5,3"/>
    <rect class="box" x="760" y="280" width="313" height="46" stroke-dasharray="5,3"/>
    <text class="title ext" x="772" y="270">observation_utility.method_pipeline</text>
    <text class="field" x="772" y="303">id (PK)</text>
    <text class="field" x="772" y="320">name (UK)</text>
  </g>
  <!-- observation_utility.method_pipeline_step -->
  <g>
    <rect class="head" x="30" y="520" width="354" height="30" style="fill:#f4f4f4" stroke-dasharray="5,3"/>
    <rect class="box" x="30" y="550" width="354" height="63" stroke-dasharray="5,3"/>
    <text class="title ext" x="42" y="540">observation_utility.method_pipeline_step</text>
    <text class="field" x="42" y="573">id (PK)</text>
    <text class="field" x="42" y="590">method_pipeline_id (FK)</text>
    <text class="field" x="42" y="607">step</text>
  </g>
  <path class="edge" d="M230,94 C298,94 292,94 360,94"/>
  <path class="edge" d="M495,250 C495,198 475,209 475,157"/>
  <path class="edge" d="M130,157 C130,231 152,226 152,300"/>
  <path class="edge" d="M760,458 C692,458 698,339 630,339"/>
  <path class="edge" d="M760,288 C692,288 698,294 630,294"/>
  <path class="edge" d="M207,520 C207,460 152,470 152,410"/>
  <rect x="30" y="643" width="18" height="12" style="fill:#dbe7f5" stroke="#3a6ea5"/>
  <text class="lbl" x="54" y="653">observation</text>
  <rect x="147" y="643" width="18" height="12" style="fill:#f4f4f4" stroke="#3a6ea5" stroke-dasharray="4,2"/>
  <text class="lbl" x="171" y="653">table in another page / schema</text>
  <text class="lbl" x="30" y="683">An ASV exists once per method pipeline; its abundance is stored per observation (non-zero values only).</text>
  <text class="lbl" x="30" y="703">edna_run_step holds reads in/out per bioinformatics step and observation (empty until delivered).</text>
</svg>

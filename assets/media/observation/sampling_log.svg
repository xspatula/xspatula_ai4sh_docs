<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a6ea5"/>
    </marker>
  </defs>

  <style>
    .box { fill: #ffffff; stroke: #3a6ea5; stroke-width: 1.5; }
    .head { fill: #dbe7f5; stroke: #3a6ea5; stroke-width: 1.5; }
    .refhead { fill: #f0f0f0; stroke: #999999; stroke-width: 1.5; stroke-dasharray: 4 2; }
    .refbox { fill: #ffffff; stroke: #999999; stroke-width: 1.5; stroke-dasharray: 4 2; }
    .title { font-size: 15px; font-weight: bold; fill: #1a1a1a; }
    .reftitle { font-size: 13px; font-weight: bold; fill: #555555; }
    .field { font-size: 12px; fill: #333333; }
    .edge { stroke: #3a6ea5; stroke-width: 1.5; fill: none; marker-end: url(#arrow3); }
    .lbl { font-size: 11px; fill: #555555; }
    .sib { font-size: 11px; fill: #b05c00; font-style: italic; }
  </style>

  <!-- campaign -->
  <g>
    <rect class="head" x="350" y="20" width="200" height="30"/>
    <rect class="box" x="350" y="50" width="200" height="40"/>
    <text class="title" x="362" y="40">campaign</text>
    <text class="field" x="362" y="73">id (PK)</text>
  </g>

  <!-- sampling_log -->
  <g>
    <rect class="head" x="350" y="140" width="200" height="30"/>
    <rect class="box" x="350" y="170" width="200" height="55"/>
    <text class="title" x="362" y="160">sampling_log</text>
    <text class="field" x="362" y="193">id (PK)</text>
    <text class="field" x="362" y="210">campaign_id (FK)</text>
  </g>
  <path class="edge" d="M450,90 L450,170"/>

  <!-- sample -->
  <g>
    <rect class="head" x="80" y="280" width="200" height="30"/>
    <rect class="box" x="80" y="310" width="200" height="55"/>
    <text class="title" x="92" y="300">sample</text>
    <text class="field" x="92" y="333">id (PK)</text>
    <text class="field" x="92" y="350">sampling_log_id (FK)</text>
  </g>

  <!-- observation_log -->
  <g>
    <rect class="head" x="620" y="280" width="220" height="30"/>
    <rect class="box" x="620" y="310" width="220" height="72"/>
    <text class="title" x="632" y="300">observation_log</text>
    <text class="field" x="632" y="333">id (PK)</text>
    <text class="field" x="632" y="350">sampling_log_id (FK)</text>
    <text class="field" x="632" y="367">provision_id (FK)</text>
  </g>

  <text class="sib" x="360" y="270">sample and observation_log are siblings — both children of sampling_log</text>

  <path class="edge" d="M400,225 C300,250 220,260 180,280"/>
  <path class="edge" d="M500,225 C600,250 700,260 730,280"/>

  <!-- provision (reference) -->
  <g>
    <rect class="refhead" x="360" y="280" width="180" height="30"/>
    <rect class="refbox" x="360" y="310" width="180" height="40"/>
    <text class="reftitle" x="372" y="300">provision</text>
    <text class="field" x="372" y="333">(see provision diagram)</text>
  </g>

  <!-- observation -->
  <g>
    <rect class="head" x="280" y="440" width="300" height="30"/>
    <rect class="box" x="280" y="470" width="300" height="72"/>
    <text class="title" x="292" y="460">observation</text>
    <text class="field" x="292" y="493">sample_id (FK)</text>
    <text class="field" x="292" y="510">observation_log_id (FK)</text>
    <text class="field" x="292" y="527">provision_id (FK)</text>
  </g>

  <path class="edge" d="M180,365 C220,410 300,440 340,470"/>
  <path class="edge" d="M730,382 C700,420 600,450 540,470"/>
  <path class="edge" d="M450,350 L450,470"/>

  <text class="lbl" x="80" y="550">observation converges sample, observation_log, and provision — it belongs to all three, not nested under any one of them.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a6ea5"/>
    </marker>
  </defs>

  <style>
    .box { fill: #ffffff; stroke: #3a6ea5; stroke-width: 1.5; }
    .head { fill: #dbe7f5; stroke: #3a6ea5; stroke-width: 1.5; }
    .refhead { fill: #f0f0f0; stroke: #999999; stroke-width: 1.5; stroke-dasharray: 4 2; }
    .refbox { fill: #ffffff; stroke: #999999; stroke-width: 1.5; stroke-dasharray: 4 2; }
    .title { font-size: 15px; font-weight: bold; fill: #1a1a1a; }
    .reftitle { font-size: 13px; font-weight: bold; fill: #555555; }
    .field { font-size: 12px; fill: #333333; }
    .edge { stroke: #3a6ea5; stroke-width: 1.5; fill: none; marker-end: url(#arrow2); }
    .lbl { font-size: 11px; fill: #555555; }
  </style>

  <!-- quantity -->
  <g>
    <rect class="head" x="30" y="30" width="180" height="30"/>
    <rect class="box" x="30" y="60" width="180" height="40"/>
    <text class="title" x="42" y="50">quantity</text>
    <text class="field" x="42" y="83">id (PK)</text>
  </g>

  <!-- provision (reference, drawn dashed - see other diagram) -->
  <g>
    <rect class="refhead" x="260" y="30" width="180" height="30"/>
    <rect class="refbox" x="260" y="60" width="180" height="40"/>
    <text class="reftitle" x="272" y="50">provision</text>
    <text class="field" x="272" y="83">(see provision diagram)</text>
  </g>

  <!-- analysis_method -->
  <g>
    <rect class="head" x="490" y="30" width="180" height="30"/>
    <rect class="box" x="490" y="60" width="180" height="40"/>
    <text class="title" x="502" y="50">analysis_method</text>
    <text class="field" x="502" y="83">id (PK)</text>
  </g>

  <!-- unit -->
  <g>
    <rect class="head" x="710" y="30" width="160" height="30"/>
    <rect class="box" x="710" y="60" width="160" height="40"/>
    <text class="title" x="722" y="50">unit</text>
    <text class="field" x="722" y="83">id (PK)</text>
  </g>

  <!-- indicator -->
  <g>
    <rect class="head" x="30" y="220" width="220" height="30"/>
    <rect class="box" x="30" y="250" width="220" height="72"/>
    <text class="title" x="42" y="240">indicator</text>
    <text class="field" x="42" y="273">id (PK)</text>
    <text class="field" x="42" y="290">quantity_id (FK)</text>
    <text class="field" x="42" y="307">name</text>
  </g>

  <!-- provision_indicator -->
  <g>
    <rect class="head" x="380" y="220" width="280" height="30"/>
    <rect class="box" x="380" y="250" width="280" height="106"/>
    <text class="title" x="392" y="240">provision_indicator</text>
    <text class="field" x="392" y="273">provision_id (FK)</text>
    <text class="field" x="392" y="290">indicator_id (FK)</text>
    <text class="field" x="392" y="307">analysis_method_id (FK)</text>
    <text class="field" x="392" y="324">unit_id (FK)</text>
    <text class="field" x="392" y="341">UNIQUE(provision_id, indicator_id)</text>
  </g>

  <!-- arrows into indicator + provision_indicator -->
  <path class="edge" d="M120,100 L120,220"/>
  <path class="edge" d="M250,281 L380,300"/>
  <path class="edge" d="M350,100 C350,160 400,190 420,250"/>
  <path class="edge" d="M580,100 L580,250"/>
  <path class="edge" d="M790,100 C790,160 700,190 660,250"/>

  <!-- indicator_parity -->
  <g>
    <rect class="head" x="30" y="440" width="280" height="30"/>
    <rect class="box" x="30" y="470" width="280" height="55"/>
    <text class="title" x="42" y="460">indicator_parity</text>
    <text class="field" x="42" y="493">src_indicator_id (FK)</text>
    <text class="field" x="42" y="510">dst_indicator_id (FK)</text>
  </g>

  <!-- indicator self-relationship via indicator_parity -->
  <path class="edge" d="M110,322 C90,370 90,410 110,440"/>
  <path class="edge" d="M170,322 C210,370 210,410 190,440"/>

  <text class="lbl" x="30" y="550">indicator_parity links two indicator rows (src/dst) declared equivalent across sources.</text>
</svg>
